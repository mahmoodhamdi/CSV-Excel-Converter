name: Build verticals

# Builds a Docker image per vertical brand on tag push or manual dispatch.
# Requires DOCKER_HUB_USER and DOCKER_HUB_TOKEN repository secrets.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      vertical:
        description: 'Specific vertical to build (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - base
          - accounting-bridge
          - edu-grades
          - dev-data-kit
          - crm-sync
          - invoice-flow

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vertical:
          - base
          - accounting-bridge
          - edu-grades
          - dev-data-kit
          - crm-sync
          - invoice-flow

    steps:
      - name: Skip non-matching vertical
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.vertical != 'all' &&
          github.event.inputs.vertical != matrix.vertical
        run: echo "Skipping ${{ matrix.vertical }} (input requested ${{ github.event.inputs.vertical }})" && exit 0

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKER_HUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}

      - name: Build (and push if secrets configured)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            BRAND=${{ matrix.vertical }}
            NEXT_PUBLIC_BRAND=${{ matrix.vertical }}
          push: ${{ secrets.DOCKER_HUB_USER != '' }}
          tags: |
            mwmsoftware/csv-converter-${{ matrix.vertical }}:latest
            mwmsoftware/csv-converter-${{ matrix.vertical }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.vertical }}
          cache-to: type=gha,scope=${{ matrix.vertical }},mode=max
